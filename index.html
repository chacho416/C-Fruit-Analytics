<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C-Fruit-Analytics — Scanner Agrícola</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================================
       Variables & Reset (Adaptado para Madurez)
    ===================================================================== */
    :root {
      --bg:            #0d0d0d;
      --surface:       #161616;
      --border:        rgba(255,255,255,0.07);
      --text-primary:  #f0ece4;
      --text-muted:    rgba(240,236,228,0.38);
      --accent:        #c8f060; 

      /* Nuevos Colores de Estados */
      --inmaduro-bg:   #0a1f0e; --inmaduro-glow: #2dff6e; --inmaduro-text: #b6ffcc;
      --bueno-bg:      #1a1f0a; --bueno-glow:    #c8f060; --bueno-text:    #e4ffb3;
      --pinton-bg:     #1f140a; --pinton-glow:   #ffa63c; --pinton-text:   #ffd9b3;
      --pasado-bg:     #1f0a0a; --pasado-glow:   #ff3c3c; --pasado-text:   #ffb3b3;

      --neutral-bg:    #0d0d0d;

      --radius:        6px;
      --font-display:  'Bebas Neue', sans-serif;
      --font-mono:     'DM Mono', monospace;
      --transition-slow:   0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text-primary); font-family: var(--font-mono); overflow: hidden; }

    /* Capa de fondo */
    #bg-layer { position: fixed; inset: 0; background: var(--neutral-bg); transition: background var(--transition-slow), box-shadow var(--transition-slow); z-index: 0; }
    #bg-layer::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(200,240,96,0.04) 0%, transparent 70%); pointer-events: none; }
    
    body.estado-inmaduro #bg-layer { background: var(--inmaduro-bg); box-shadow: inset 0 0 180px rgba(45,255,110,0.12); }
    body.estado-bueno    #bg-layer { background: var(--bueno-bg);    box-shadow: inset 0 0 180px rgba(200,240,96,0.12); }
    body.estado-pinton   #bg-layer { background: var(--pinton-bg);   box-shadow: inset 0 0 180px rgba(255,166,60,0.12); }
    body.estado-pasado   #bg-layer { background: var(--pasado-bg);   box-shadow: inset 0 0 180px rgba(255,60,60,0.14); }

    #app { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; grid-template-areas: "header" "main" "footer"; padding: 28px 36px; gap: 0; }

    /* Header */
    header { grid-area: header; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
    .logo { display: flex; align-items: baseline; gap: 10px; }
    .logo-text { font-family: var(--font-display); font-size: 1.9rem; letter-spacing: 0.06em; color: var(--text-primary); line-height: 1; }
    .logo-badge { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 2px 7px; border-radius: 2px; }

    /* Main & Video */
    main { grid-area: main; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
    video { border: 2px solid var(--border); border-radius: 10px; height: 35vh; box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: cover;}
    button { background: transparent; color: var(--text-primary); border: 1px solid var(--border); padding: 10px 30px; font-size: 1rem; font-family: var(--font-mono); border-radius: var(--radius); cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; margin-bottom: 10px;}
    button:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    #etiqueta-estado { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text-muted); }
    #estado-texto { font-family: var(--font-display); font-size: clamp(4rem, 10vw, 8rem); line-height: 0.9; letter-spacing: 0.02em; color: var(--text-primary); transition: color var(--transition-slow), text-shadow var(--transition-slow); }

    body.estado-inmaduro #estado-texto { color: var(--inmaduro-text); text-shadow: 0 0 60px rgba(45,255,110,0.35); }
    body.estado-bueno    #estado-texto { color: var(--bueno-text); text-shadow: 0 0 60px rgba(200,240,96,0.35); }
    body.estado-pinton   #estado-texto { color: var(--pinton-text); text-shadow: 0 0 60px rgba(255,166,60,0.35); }
    body.estado-pasado   #estado-texto { color: var(--pasado-text); text-shadow: 0 0 60px rgba(255,60,60,0.4); }

    /* Detalles */
    #confianza-wrap { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    #confianza-label { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted); }

    /* Historial */
    #historial { position: fixed; right: 36px; top: 50%; transform: translateY(-50%); width: 220px; display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: hidden; }
    #historial-titulo { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .entrada-historial { font-size: 0.65rem; padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); display: flex; justify-content: space-between; align-items: center; }
    .entrada-historial .h-estado { font-weight: 500; }
    .entrada-historial .h-hora { color: var(--text-muted); font-size: 0.55rem; }
    .h-inmaduro { color: var(--inmaduro-glow); } .h-bueno { color: var(--bueno-glow); } .h-pinton { color: var(--pinton-glow); } .h-pasado { color: var(--pasado-glow); }

    /* Footer */
    footer { grid-area: footer; border-top: 1px solid var(--border); padding-top: 14px; display: flex; align-items: center; justify-content: space-between; }
    #contador-wrap { display: flex; gap: 28px; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
    .stat-valor { font-size: 0.92rem; font-weight: 500; color: var(--text-primary); }
    #copyright { font-size: 0.58rem; letter-spacing: 0.1em; color: var(--text-muted); }
  </style>
</head>

<body>
  <div id="bg-layer"></div>
  <div id="app">
    <header>
      <div class="logo">
        <span class="logo-text">C-Fruit-Analytics</span>
        <span class="logo-badge">IA MADUREZ</span>
      </div>
    </header>

    <main>
      <video id="camara_web" autoplay playsinline></video>
      <canvas id="lienzo_oculto" style="display:none;"></canvas>
      <button onclick="tomarFotoYAnalizar()">Escanear Fruta</button>

      <div id="etiqueta-estado">VEREDICTO DE CALIDAD</div>
      <div id="estado-texto">—</div>
      
      <div id="confianza-wrap">
        <span id="confianza-label">Índice de Oscuridad: </span>
        <span id="confianza-valor" style="color: var(--accent); font-weight: bold;">0%</span>
      </div>
    </main>

    <footer>
      <div id="contador-wrap">
        <div class="stat"><span class="stat-label">Escaneos</span><span class="stat-valor" id="cnt-total">0</span></div>
        <div class="stat"><span class="stat-label">Buenos</span><span class="stat-valor" id="cnt-buenos">0</span></div>
        <div class="stat"><span class="stat-label">Descarte</span><span class="stat-valor" id="cnt-malos">0</span></div>
      </div>
      <span id="copyright">© C-Fruit-Analytics</span>
    </footer>
  </div>

  <aside id="historial">
    <div id="historial-titulo">Historial Reciente</div>
  </aside>

  <script>
    const video = document.getElementById('camara_web');
    const canvas = document.getElementById('lienzo_oculto');
    const contexto = canvas.getContext('2d');
    
    // Contadores
    const contadores = { total: 0, buenos: 0, malos: 0 };

    // Encender cámara al cargar
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280, height: 720 } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => console.error("Error de cámara: ", err));

    function tomarFotoYAnalizar() {
      document.getElementById('estado-texto').innerText = "PROCESANDO...";
      document.body.className = ''; // Limpiar colores

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append("file", blob, "captura.jpg");

        // Conexión con tu nuevo servidor YOLOv8
        fetch('http://127.0.0.1:8000/procesar', { method: 'POST', body: formData })
          .then(res => res.json())
          .then(datos => {
            if(datos.veredicto) {
              manejarResultado(datos);
            } else if (datos.error) {
              document.getElementById('estado-texto').innerText = "ERROR DE IA";
              console.error(datos.error);
            } else {
              document.getElementById('estado-texto').innerText = "SIN AGUACATE";
            }
          })
          .catch(err => {
              console.error("Error de conexión:", err);
              document.getElementById('estado-texto').innerText = "SIN CONEXIÓN";
          });
      }, 'image/jpeg');
    }

    function manejarResultado(datos) {
      // Las variables directas de tu nuevo servidor
      const veredicto = datos.veredicto;
      const confianza = datos.confianza;
      
      let claseColor = '';
      let claseTexto = '';

      // =========================================================
      // 🚨 SISTEMA DE ALERTAS Y CLASIFICACIÓN (LOS 10 PUNTOS) 🚨
      // =========================================================
      
      // OJO: Cambia "sana" por el nombre exacto de la clase que le pusiste en Roboflow
      if(veredicto.toLowerCase().includes("sana") || veredicto.toLowerCase().includes("buen")) { 
          claseColor = 'estado-bueno'; 
          claseTexto = 'h-bueno'; 
          contadores.buenos++; 
      } 
      else { 
          // Si detecta cualquier enfermedad o defecto (Descarte)
          claseColor = 'estado-pasado'; 
          claseTexto = 'h-pasado'; 
          contadores.malos++; 
          
          // LA NOTIFICACIÓN CRÍTICA EXIGIDA POR LA RÚBRICA
          alert(`⚠️ ALERTA CRÍTICA: ¡Aguacate con defectos detectado! (${veredicto.toUpperCase()})`);
      }

      // Actualizar UI principal
      document.body.className = claseColor;
      // --- INICIO DEL FILTRO DE TEXTO ---
    let textoLimpio = veredicto.toUpperCase(); 

    if (textoLimpio === "PALTA_MALOGRADA") {
        textoLimpio = "AGUACATE ENFERMO"; 
    } else if (textoLimpio === "PALTA_SANA") { // Cambia "PALTA_SANA" por el nombre exacto de tu otra clase si es distinto
        textoLimpio = "AGUACATE SANO";
    }

    // Pintamos el texto ya corregido en la interfaz
    document.getElementById('estado-texto').innerText = textoLimpio;
    // --- FIN DEL FILTRO DE TEXTO ---;
      document.getElementById('confianza-valor').innerText = confianza;
      
      // Actualizar contadores
      contadores.total++;
      document.getElementById('cnt-total').innerText = contadores.total;
      document.getElementById('cnt-buenos').innerText = contadores.buenos;
      document.getElementById('cnt-malos').innerText = contadores.malos;

      // Agregar al historial lateral
      const ahora = new Date();
      const horaStr = ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const entrada = document.createElement('div');
      entrada.className = 'entrada-historial';
      entrada.innerHTML = `<span class="h-estado ${claseTexto}">${veredicto.toUpperCase()}</span><span class="h-hora">${horaStr}</span>`;
      
      const elHistorial = document.getElementById('historial');
      elHistorial.insertBefore(entrada, document.getElementById('historial-titulo').nextSibling);
      if (elHistorial.children.length > 7) elHistorial.lastChild.remove();
    }
    // =========================================================
    // 🕵️‍♂️ VIGILANTE CONTINUO DEL SENSOR (GATILLO AUTOMÁTICO)
    // =========================================================
    async function vigilarSemoforoSensor() {
        try {
            // Le preguntamos al servidor si el Arduino mandó una señal
            const respuesta = await fetch('http://127.0.0.1:8000/status_alerta');
            const resultado = await respuesta.json();
            
            // Si el servidor dice que sí, disparamos la captura sin tocar el botón
            if (resultado.disparar === true) {
                console.log("¡Señal de hardware detectada! Escaneando fruto automáticamente...");
                tomarFotoYAnalizar();
            }
        } catch (error) {
            // Silencioso para evitar saturar la consola si el servidor se apaga un momento
        }
    }

    // Configura el ciclo automático para que revise el semáforo cada 200ms
    setInterval(vigilarSemoforoSensor, 200);
  </script>
</body>
</html>
